
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Reiseprojekt Bildpool</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {font-family:Arial;background:#f5f2eb;margin:40px}
h1 {color:#b22222}
details {background:white;padding:15px;border-radius:10px;margin-bottom:20px}
.grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}

.card {background:#fafafa;padding:8px;border-radius:8px;border:1px solid #ddd}
.card img {width:100%;height:130px;object-fit:cover;border-radius:6px}

.actions {margin-top:6px;font-size:14px;display:flex;gap:10px;align-items:center}

.icon {
width:18px;
height:18px;
cursor:pointer;
opacity:0.35;
transition:all 0.15s;
}

.icon:hover {transform:scale(1.15)}

.icon.active-fav {
opacity:1;
}

.icon.active-panorama {
opacity:1;
}

.icon svg {width:100%;height:100%;fill:#777}

.icon.active-fav svg {fill:gold}
.icon.active-panorama svg {fill:#2a7cff}

.debug {margin-top:6px;font-size:11px;background:#eee;padding:4px;border-radius:4px}
</style>
</head>

<body>

<h1>Reiseprojekt Bildpool</h1>

<div id="userSelect">
<select id="userDropdown"></select>
<button id="confirmUser">Bestätigen</button>
</div>

<script>

const supabaseClient = supabase.createClient("https://gvbipujajoxdrolatbrw.supabase.co", "public-anon-key-placeholder")
const places = ["salzburg", "hamburg", "bratislava", "karlsbad", "bad_flinsberg", "kirschau", "bad_staffelstein", "weimar", "erfurt", "dresden", "breslau", "prag", "nuernberg", "wien"]
const users = ["Jens", "Simone", "Stephan", "Steffen", "Nobody1", "Nobody2", "Nobody3"]

let userId = localStorage.getItem("reise_user")
let userName = localStorage.getItem("reise_user_name")

function populateUsers(){
 const dd=document.getElementById("userDropdown")
 users.forEach(n=>{
  const opt=document.createElement("option")
  opt.value=n
  opt.textContent=n
  dd.appendChild(opt)
 })
}

async function setUser(){
 const name=document.getElementById("userDropdown").value
 userName=name

 const {data} = await supabaseClient.from("nutzer").select("*").eq("name",name).maybeSingle()

 let uid
 if(data) uid=data.id
 else{
  const {data:ins} = await supabaseClient.from("nutzer").insert({name:name}).select().single()
  uid=ins.id
 }

 userId=uid
 localStorage.setItem("reise_user",uid)
 localStorage.setItem("reise_user_name",name)

 document.getElementById("userSelect").style.display="none"
 init()
}

async function loadImages(place){

 const {data:images} = await supabaseClient.from("bilder").select("*").eq("ort",place)
 const container=document.getElementById(place+"_list")
 container.innerHTML=""

 if(!images) return

 for(const img of images){

  const {data:imgRatings} = await supabaseClient
   .from("bewertungen")
   .select("*")
   .eq("bild_id", img.id)

  const myEntry = imgRatings.find(r => r.nutzer_id === userId)

  const isFavorite = myEntry?.favorite === true
  const isPanorama = myEntry?.panorama === true

  const card=document.createElement("div")
  card.className="card"

  const image=document.createElement("img")
  image.src=img.url

  const actions=document.createElement("div")
  actions.className="actions"

  const fav=document.createElement("div")
  fav.className="icon "+(isFavorite?"active-fav":"")
  fav.innerHTML=`<svg viewBox="0 0 24 24"><path d="M12 17.3l-6.18 3.73 1.64-7.03L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.46 4.76 1.64 7.03z"/></svg>`

  const pano=document.createElement("div")
  pano.className="icon "+(isPanorama?"active-panorama":"")
  pano.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM8 13l2.5-3 2 2.5L16 9l4 5H8z"/></svg>`

  const debug=document.createElement("div")
  debug.className="debug"
  debug.textContent="favorite:"+isFavorite+" | panorama:"+isPanorama

  actions.appendChild(fav)
  actions.appendChild(document.createTextNode("Favorit"))
  actions.appendChild(pano)
  actions.appendChild(document.createTextNode("Panorama"))

  card.appendChild(image)
  card.appendChild(actions)
  card.appendChild(debug)

  container.appendChild(card)

 }
}

async function addImage(place){
 const input=document.getElementById(place+"_input")
 const url=input.value.trim()
 if(!url) return

 await supabaseClient.from("bilder").insert({ort:place,url:url})
 input.value=""
 loadImages(place)
}

function init(){
 places.forEach(p=>loadImages(p))
}

document.addEventListener("DOMContentLoaded",()=>{
 populateUsers()
 document.getElementById("confirmUser").onclick=setUser
})

</script>
