
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Reiseprojekt Bildpool</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
body {font-family:Arial;background:#f5f2eb;margin:40px}
h1 {color:#b22222}
details {background:white;padding:15px;border-radius:10px;margin-bottom:20px}
.grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}

.card {background:#fafafa;padding:8px;border-radius:8px;position:relative;border:2px solid transparent}
.card img {width:100%;height:130px;object-fit:cover;border-radius:6px;cursor:pointer}
.remove {position:absolute;top:4px;right:6px;color:#b22222;font-weight:bold;cursor:pointer}

.rating span {cursor:pointer;font-size:20px}
.ratingDisplay {font-size:12px;margin-top:4px}
.actions {margin-top:6px;font-size:14px;color:black}

.icon {color:#bbb;font-size:16px;margin-right:6px}
.icon.active-fav {color:gold}
.icon.active-panorama {color:#2a7cff}

.debug {margin-top:6px;font-size:11px;color:#555;background:#eee;padding:4px;border-radius:4px}

#preview {display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.92);align-items:center;justify-content:center;z-index:999999}
#preview img {max-width:90vw;max-height:90vh}

#userSelect {background:white;padding:20px;border-radius:10px;margin-bottom:30px}
</style>
</head>

<body>

<h1>Reiseprojekt Bildpool</h1>

<div id="currentUser"></div>

<div id="userSelect">
<strong>Nutzer auswählen:</strong><br><br>
<select id="userDropdown"></select>
<button id="confirmUser">Bestätigen</button>
</div>

<div id="preview"><img id="previewimg"></div>

<script>

const supabaseClient = supabase.createClient("https://gvbipujajoxdrolatbrw.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2YmlwdWpham94ZHJvbGF0YnJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1ODk2MTAsImV4cCI6MjA4OTE2NTYxMH0.b_G8AmG31UKSpa_wfpJo-WZ7XDWHLoSwq3QxVG6L5ng")
const places = ["salzburg", "hamburg", "bratislava", "karlsbad", "bad_flinsberg", "kirschau", "bad_staffelstein", "weimar", "erfurt", "dresden", "breslau", "prag", "nuernberg", "wien"]
const users = ["Jens", "Simone", "Stephan", "Steffen", "Nobody1", "Nobody2", "Nobody3"]

let userId = localStorage.getItem("reise_user")
let userName = localStorage.getItem("reise_user_name")

function populateUsers(){
 const dd=document.getElementById("userDropdown")
 users.forEach(n=>{
   const opt=document.createElement("option")
   opt.value=n
   opt.textContent=n
   dd.appendChild(opt)
 })
}

async function setUser(){
 const name=document.getElementById("userDropdown").value
 userName=name
 localStorage.setItem("reise_user_name",name)

 const {data} = await supabaseClient.from("nutzer").select("*").eq("name",name).maybeSingle()
 let uid

 if(data) uid=data.id
 else{
   const {data:ins} = await supabaseClient.from("nutzer").insert({name:name}).select().single()
   uid=ins.id
 }

 userId=uid
 localStorage.setItem("reise_user",uid)

 document.getElementById("userSelect").style.display="none"
 init()
}

function openPreview(src){
 document.getElementById("previewimg").src=src
 document.getElementById("preview").style.display="flex"
}

document.addEventListener("click",e=>{
 if(e.target.id==="preview") document.getElementById("preview").style.display="none"
})

async function loadImages(place){

 const {data:images} = await supabaseClient.from("bilder").select("*").eq("ort",place)
 const container=document.getElementById(place+"_list")
 container.innerHTML=""

 if(!images) return

 for (const img of images){

   const {data:imgRatings} = await supabaseClient
     .from("bewertungen")
     .select("*")
     .eq("bild_id", img.id)

   const myEntry = imgRatings.find(r => r.nutzer_id === userId)
   const isFavorite = myEntry && myEntry.favorite === true
   const isPanorama = myEntry && myEntry.panorama === true
   const myRating = myEntry ? myEntry.rating : 0

   const card=document.createElement("div")
   card.className="card"

   const image=document.createElement("img")
   image.src=img.url
   image.onclick=()=>openPreview(img.url)

   const ratingDiv=document.createElement("div")

   for(let i=1;i<=5;i++){
     const star=document.createElement("span")
     star.textContent = myRating>=i ? "★":"☆"
     ratingDiv.appendChild(star)
   }

   const actions=document.createElement("div")
   actions.className="actions"

   const favIcon=document.createElement("span")
   favIcon.className="icon "+(isFavorite ? "active-fav":"")
   favIcon.textContent="⭐"
   actions.appendChild(favIcon)
   actions.append(" Favorit  ")

   const panoIcon=document.createElement("span")
   panoIcon.className="icon "+(isPanorama ? "active-panorama":"")
   panoIcon.textContent="🌄"
   actions.appendChild(panoIcon)
   actions.append(" Panorama")

   const debug=document.createElement("div")
   debug.className="debug"
   debug.textContent="rating: "+myRating+" | favorite: "+isFavorite+" | panorama: "+isPanorama

   card.appendChild(image)
   card.appendChild(ratingDiv)
   card.appendChild(actions)
   card.appendChild(debug)

   container.appendChild(card)

 }

}

async function addImage(place){
 const input=document.getElementById(place+"_input")
 const url=input.value.trim()
 if(!url) return

 await supabaseClient.from("bilder").insert({ort:place,url:url})
 input.value=""
 loadImages(place)
}

function registerButtons(){
 document.querySelectorAll(".addbtn").forEach(btn=>{
  btn.onclick=()=>addImage(btn.dataset.place)
 })
}

function init(){ places.forEach(p=>loadImages(p)) }

document.addEventListener("DOMContentLoaded",()=>{

 populateUsers()
 registerButtons()
 document.getElementById("confirmUser").onclick=setUser

 if(userId && userName){

   document.getElementById("userSelect").style.display="none"
   init()

 }

})

</script>
