
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Reiseprojekt Bildpool (Supabase)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {font-family:Arial; background:#f5f2eb; margin:40px}
h1 {color:#b22222}
details {background:white;padding:15px;border-radius:10px;margin-bottom:20px}
.grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:10px}
.card {background:#fafafa;padding:6px;border-radius:6px;position:relative}
.card img {width:100%;height:120px;object-fit:cover;border-radius:6px;cursor:pointer}
.remove {position:absolute;top:4px;right:6px;color:#b22222;cursor:pointer}
.rating span {cursor:pointer;font-size:16px}
.favorite {cursor:pointer;font-size:13px}
.panorama {cursor:pointer;font-size:13px}
input {width:65%;padding:6px}
button {padding:6px 10px;margin-left:6px}

#preview {display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.8);align-items:center;justify-content:center}

#preview img {max-width:90%;max-height:90%}
</style>
</head>

<body>

<h1>Reiseprojekt Bildpool</h1>

<div id="preview"><img id="previewimg"></div>

<script>

const supabase = window.supabase.createClient(
"https://gvbipujajoxdrolatbrw.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2YmlwdWpham94ZHJvbGF0YnJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1ODk2MTAsImV4cCI6MjA4OTE2NTYxMH0.b_G8AmG31UKSpa_wfpJo-WZ7XDWHLoSwq3QxVG6L5ng"
)

const places = ['salzburg', 'hamburg', 'bratislava', 'karlsbad', 'bad_flinsberg', 'kirschau', 'bad_staffelstein', 'weimar', 'erfurt', 'dresden', 'breslau', 'prag', 'nuernberg', 'wien']

let userId = localStorage.getItem("reise_user")

if(!userId){
 userId = crypto.randomUUID()
 localStorage.setItem("reise_user",userId)
}

async function ensureUser(){
 await supabase.from("nutzer").upsert({id:userId})
}

function openPreview(src){
 const p=document.getElementById("preview")
 document.getElementById("previewimg").src=src
 p.style.display="flex"
}

document.addEventListener("click",e=>{
 if(e.target.id==="preview"){document.getElementById("preview").style.display="none"}
})

async function loadImages(place){

 const {data} = await supabase
   .from("bilder")
   .select("*")
   .eq("ort",place)

 const container=document.getElementById(place+"_list")
 container.innerHTML=""

 data.forEach(img=>{
   createCard(place,img)
 })

}

function createCard(place,img){

 const container=document.getElementById(place+"_list")

 const card=document.createElement("div")
 card.className="card"

 const remove=document.createElement("div")
 remove.className="remove"
 remove.textContent="✕"

 remove.onclick=async()=>{
   await supabase.from("bilder").delete().eq("id",img.id)
   loadImages(place)
 }

 const image=document.createElement("img")
 image.src=img.url
 image.onclick=()=>openPreview(img.url)

 const rating=document.createElement("div")
 rating.className="rating"

 for(let i=1;i<=5;i++){

  const s=document.createElement("span")
  s.textContent="☆"

  s.onclick=async()=>{

   await supabase.from("bewertungen").upsert({
    bild_id:img.id,
    nutzer_id:userId,
    rating:i
   })

  }

  rating.appendChild(s)

 }

 const fav=document.createElement("div")
 fav.className="favorite"
 fav.textContent="⭐ Favorit"

 fav.onclick=async()=>{

  await supabase.from("bewertungen").upsert({
   bild_id:img.id,
   nutzer_id:userId,
   favorite:true
  })

 }

 const pano=document.createElement("div")
 pano.className="panorama"
 pano.textContent="🌄 Panorama"

 pano.onclick=async()=>{

  await supabase.from("bewertungen").upsert({
   bild_id:img.id,
   nutzer_id:userId,
   panorama:true
  })

 }

 card.appendChild(remove)
 card.appendChild(image)
 card.appendChild(rating)
 card.appendChild(fav)
 card.appendChild(pano)

 container.appendChild(card)
}

async function addImage(place){

 const input=document.getElementById(place+"_input")
 const url=input.value.trim()

 if(!url) return

 await supabase.from("bilder").insert({
  ort:place,
  url:url
 })

 input.value=""
 loadImages(place)
}

document.addEventListener("DOMContentLoaded",async()=>{

 await ensureUser()

 document.querySelectorAll(".addbtn").forEach(btn=>{
  btn.onclick=()=>addImage(btn.dataset.place)
 })

 places.forEach(p=>loadImages(p))

})

</script>
