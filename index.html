
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Reiseprojekt Bildpool</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
body {font-family:Arial;background:#f5f2eb;margin:40px}
h1 {color:#b22222}
details {background:white;padding:15px;border-radius:10px;margin-bottom:20px}
.grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}

.card {background:#fafafa;padding:8px;border-radius:8px;border:1px solid #ddd;position:relative}
.card img {width:100%;height:130px;object-fit:cover;border-radius:6px;cursor:pointer}

.deleteBtn {position:absolute;top:6px;right:8px;color:#b22222;font-weight:bold;cursor:pointer;font-size:18px}

.rating span {cursor:pointer;font-size:20px;color:#bbb}
.rating span.active {color:#e0a800}

.actions {margin-top:6px;font-size:14px;color:#333}

.icon {font-size:20px;color:#bbb;margin-right:6px;cursor:pointer}
.icon.favorite {color:#e0a800}
.icon.panorama {color:#2a7cff}

#userSelect {background:white;padding:20px;border-radius:10px;margin-bottom:30px}

#preview {display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);align-items:center;justify-content:center;z-index:9999}
#preview img {max-width:90%;max-height:90%}
.closePreview {position:absolute;top:20px;right:30px;color:white;font-size:30px;cursor:pointer}
</style>
</head>

<body>

<h1>Reiseprojekt Bildpool</h1>

<div id="userSelect">
<strong>Nutzer auswählen:</strong><br><br>
<select id="userDropdown"></select>
<button id="confirmUser">Bestätigen</button>
</div>

<div id="preview">
<span class="closePreview" onclick="closePreview()">×</span>
<img id="previewImg">
</div>

<script>

const projectUrl = "https://gvbipujajoxdrolatbrw.supabase.co"
const anonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2YmlwdWpham94ZHJvbGF0YnJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1ODk2MTAsImV4cCI6MjA4OTE2NTYxMH0.b_G8AmG31UKSpa_wfpJo-WZ7XDWHLoSwq3QxVG6L5ng"

const supabaseClient = supabase.createClient(projectUrl, anonKey)

const places = [
"salzburg","hamburg","bratislava","karlsbad","bad_flinsberg","kirschau",
"bad_staffelstein","weimar","erfurt","dresden","breslau","prag","nuernberg","wien"
]

const users = ["Jens","Simone","Stephan","Steffen","Nobody1","Nobody2","Nobody3"]

let userId = localStorage.getItem("reise_user")
let userName = localStorage.getItem("reise_user_name")

function populateUsers(){
 const dd=document.getElementById("userDropdown")
 users.forEach(n=>{
   const opt=document.createElement("option")
   opt.value=n
   opt.textContent=n
   dd.appendChild(opt)
 })
}

async function setUser(){
 const name=document.getElementById("userDropdown").value
 userName=name
 localStorage.setItem("reise_user_name",name)

 const {data} = await supabaseClient.from("nutzer").select("*").eq("name",name).maybeSingle()

 let uid
 if(data) uid=data.id
 else{
   const {data:ins} = await supabaseClient.from("nutzer").insert({name:name}).select().single()
   uid=ins.id
 }

 userId=uid
 localStorage.setItem("reise_user",uid)

 document.getElementById("userSelect").style.display="none"
 init()
}

function openPreview(url){
 document.getElementById("previewImg").src=url
 document.getElementById("preview").style.display="flex"
}

function closePreview(){
 document.getElementById("preview").style.display="none"
}

async function deleteImage(bildId, place){

 if(!confirm("Bild wirklich löschen?\nAlle Bewertungen werden ebenfalls entfernt.")) return

 await supabaseClient.from("bewertungen").delete().eq("bild_id", bildId)
 await supabaseClient.from("bilder").delete().eq("id", bildId)

 loadImages(place)
}

async function saveRating(bild_id, rating){

 const {data} = await supabaseClient.from("bewertungen").select("*").eq("bild_id", bild_id).eq("nutzer_id", userId).maybeSingle()

 if(data){
   await supabaseClient.from("bewertungen").update({rating:rating}).eq("id",data.id)
 } else {
   await supabaseClient.from("bewertungen").insert({bild_id:bild_id,nutzer_id:userId,rating:rating})
 }
}

async function toggleFavorite(bild_id,current){

 const {data} = await supabaseClient.from("bewertungen").select("*").eq("bild_id", bild_id).eq("nutzer_id", userId).maybeSingle()

 if(data){
   await supabaseClient.from("bewertungen").update({favorite:!current}).eq("id",data.id)
 } else {
   await supabaseClient.from("bewertungen").insert({bild_id:bild_id,nutzer_id:userId,favorite:true})
 }
}

async function togglePanorama(place,bild_id,current){

 if(!current){
   const {data:images} = await supabaseClient.from("bilder").select("id").eq("ort",place)
   const ids = images.map(i=>i.id)

   await supabaseClient.from("bewertungen").update({panorama:false}).in("bild_id",ids).eq("nutzer_id",userId)
 }

 const {data} = await supabaseClient.from("bewertungen").select("*").eq("bild_id", bild_id).eq("nutzer_id", userId).maybeSingle()

 if(data){
   await supabaseClient.from("bewertungen").update({panorama:!current}).eq("id",data.id)
 } else {
   await supabaseClient.from("bewertungen").insert({bild_id:bild_id,nutzer_id:userId,panorama:true})
 }
}

async function loadImages(place){

 const {data:images} = await supabaseClient.from("bilder").select("*").eq("ort",place)
 const container=document.getElementById(place+"_list")
 container.innerHTML=""

 if(!images) return

 for (const img of images){

   const {data:imgRatings} = await supabaseClient.from("bewertungen").select("*").eq("bild_id", img.id)

   const myEntry = imgRatings.find(r => r.nutzer_id === userId)

   const isFavorite = myEntry?.favorite === true
   const isPanorama = myEntry?.panorama === true
   const myRating = myEntry?.rating || 0

   const card=document.createElement("div")
   card.className="card"

   const del=document.createElement("span")
   del.className="deleteBtn"
   del.textContent="✖"
   del.onclick=()=>deleteImage(img.id, place)

   const image=document.createElement("img")
   image.src=img.url
   image.onclick=()=>openPreview(img.url)

   const ratingDiv=document.createElement("div")
   ratingDiv.className="rating"

   for(let i=1;i<=5;i++){
     const star=document.createElement("span")
     star.textContent="★"
     if(i<=myRating) star.classList.add("active")
     star.onclick=async()=>{
        await saveRating(img.id,i)
        loadImages(place)
     }
     ratingDiv.appendChild(star)
   }

   const actions=document.createElement("div")
   actions.className="actions"

   const favIcon=document.createElement("span")
   favIcon.className="icon "+(isFavorite ? "favorite":"")
   favIcon.textContent="★"
   favIcon.onclick=async()=>{
      await toggleFavorite(img.id,isFavorite)
      loadImages(place)
   }

   const panoIcon=document.createElement("span")
   panoIcon.className="icon "+(isPanorama ? "panorama":"")
   panoIcon.textContent="★"
   panoIcon.onclick=async()=>{
      await togglePanorama(place,img.id,isPanorama)
      loadImages(place)
   }

   actions.appendChild(favIcon)
   actions.append(" Favorit  ")
   actions.appendChild(panoIcon)
   actions.append(" Panorama")

   card.appendChild(del)
   card.appendChild(image)
   card.appendChild(ratingDiv)
   card.appendChild(actions)

   container.appendChild(card)
 }
}

async function addImage(place){
 const input=document.getElementById(place+"_input")
 const url=input.value.trim()
 if(!url) return

 await supabaseClient.from("bilder").insert({ort:place,url:url})
 input.value=""
 loadImages(place)
}

function registerButtons(){
 document.querySelectorAll(".addbtn").forEach(btn=>{
  btn.onclick=()=>addImage(btn.dataset.place)
 })
}

function init(){ places.forEach(p=>loadImages(p)) }

document.addEventListener("DOMContentLoaded",()=>{

 populateUsers()
 registerButtons()
 document.getElementById("confirmUser").onclick=setUser

 if(userId && userName){
   document.getElementById("userSelect").style.display="none"
   init()
 }

})
</script>
